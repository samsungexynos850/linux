%YAML 1.2
---
$id: http://devicetree.org/schemas/mfd/samsung,s2mu106-pmic.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Samsung S2MU106 Power Management IC

maintainers:
  - Thomas Turner <tturner@lineageos.org>

description: |
  The S2MU106 is a companion power management IC which includes subdevices
  for a battery charger, an MUIC (Micro USB Interface Controller), a power
  meter, flash LED and haptic controllers. This node describes the main I2C
  address, which hosts the interrupt controller and the battery charger. The
  battery fuel gauge has its own I2C address and is described separately.

allOf:
  - $ref: /schemas/power/supply/power-supply.yaml#

properties:
  compatible:
    const: samsung,s2mu106-pmic

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

required:
  - compatible
  - reg

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/irq.h>

    i2c {
      #address-cells = <1>;
      #size-cells = <0>;

      pmic@3d {
        compatible = "samsung,s2mu106-pmic";
        reg = <0x3d>;

        interrupt-parent = <&gpa2>;
        interrupts = <5 IRQ_TYPE_LEVEL_LOW>;
      };
    };
