%YAML 1.2
---
$id: http://devicetree.org/schemas/power/supply/samsung,s2mu106-fuel-gauge.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Samsung S2MU106 PMIC Battery Fuel Gauge

maintainers:
  - Thomas Turner <tturner@lineageos.org>

description:
  The S2MU106 PMIC integrates a battery fuel gauge with its own I2C address,
  which tracks the battery state of charge with a coulomb counter and a
  battery model. The gauge is powered by the battery and keeps its state
  across reboots, the battery model is only programmed after it was reset.

allOf:
  - $ref: power-supply.yaml#

properties:
  compatible:
    const: samsung,s2mu106-fuel-gauge

  reg:
    maxItems: 1

  interrupts:
    description: Low battery and low voltage alert.
    maxItems: 1

  wakeup-source: true

  io-channels:
    description: ADC channel connected to the battery thermistor.
    maxItems: 1

  io-channel-names:
    const: temp

  samsung,temp-lookup-table:
    $ref: /schemas/types.yaml#/definitions/int32-matrix
    description:
      Battery thermistor lookup table, as pairs of temperature (in
      millidegrees Celsius) and ADC value, sorted by ascending ADC value.
    minItems: 2
    items:
      items:
        - description: Temperature in millidegrees Celsius
        - description: ADC value

  shunt-resistor-micro-ohms:
    description:
      Value of the current sense resistor. The factory trim of the gauge
      assumes 10 mOhm.
    enum: [5000, 10000]
    default: 10000

  samsung,battery-capacity:
    $ref: /schemas/types.yaml#/definitions/uint8-array
    description:
      Capacity parameters of the battery model, as provided by Samsung for
      the battery pack.
    minItems: 4
    maxItems: 4

  samsung,battery-model:
    $ref: /schemas/types.yaml#/definitions/uint8-array
    description:
      Battery model tables, as provided by Samsung for the battery pack.
    minItems: 110
    maxItems: 110

dependencies:
  io-channels: [ 'io-channel-names', 'samsung,temp-lookup-table' ]
  samsung,battery-capacity: [ 'samsung,battery-model' ]
  samsung,battery-model: [ 'samsung,battery-capacity' ]

required:
  - compatible
  - reg

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/irq.h>

    i2c {
      #address-cells = <1>;
      #size-cells = <0>;

      fuel-gauge@3b {
        compatible = "samsung,s2mu106-fuel-gauge";
        reg = <0x3b>;

        interrupt-parent = <&gpa3>;
        interrupts = <0 IRQ_TYPE_EDGE_BOTH>;
        wakeup-source;

        monitored-battery = <&battery>;
        shunt-resistor-micro-ohms = <5000>;
      };
    };
