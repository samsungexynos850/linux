%YAML 1.2
---
$id: http://devicetree.org/schemas/input/touchscreen/syna,td4150-touchscreen.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Synaptics TD4150 touch controller

maintainers:
  - Thomas Turner <tturner@lineageos.org>

description:
  The TD4150 is a touch and display driver integration (TDDI) chip, now sold
  by OmniVision. Its touch controller talks the Synaptics TouchComm protocol
  over SPI. It has no flash for its application firmware, which the host
  downloads to it on every power up.

allOf:
  - $ref: touchscreen.yaml#
  - $ref: /schemas/spi/spi-peripheral-props.yaml#

properties:
  compatible:
    const: syna,td4150-touchscreen

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  spi-cpha: true
  spi-cpol: true

  reset-gpios:
    maxItems: 1

  vdd-supply:
    description: Digital core supply

  vddio-supply:
    description: Host interface supply

  firmware-name:
    maxItems: 1
    description:
      File name of the firmware image to download, defaults to
      td4150_a21s.bin

  wakeup-source: true

required:
  - compatible
  - reg
  - interrupts

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>
    #include <dt-bindings/interrupt-controller/irq.h>

    spi {
        #address-cells = <1>;
        #size-cells = <0>;

        touchscreen@0 {
            compatible = "syna,td4150-touchscreen";
            reg = <0>;
            spi-max-frequency = <7000000>;
            spi-cpol;
            spi-cpha;
            interrupt-parent = <&gpa0>;
            interrupts = <0 IRQ_TYPE_LEVEL_LOW>;
            reset-gpios = <&gpg2 3 GPIO_ACTIVE_LOW>;
            wakeup-source;
        };
    };
